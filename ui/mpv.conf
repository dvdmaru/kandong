# 看懂 KanDong：mpv 設定（配 uosc 用）

# uosc 自己畫控制列與音量條，關掉 mpv 內建的
osc=no
osd-bar=no

# 滑鼠停 2 秒就隱藏游標，uosc 的控制列跟著淡出
cursor-autohide=2000

# 播完停在最後一格，不自動關視窗（PotPlayer 的習慣）
keep-open=yes

# 中文介面字型
osd-font="PingFang TC"

[windows-font]
profile-cond=platform == "windows"
profile-restore=copy
osd-font="Microsoft JhengHei UI"
