# 看懂 KanDong：uosc 設定（只列跟 uosc 預設不同的項目，其餘照 uosc 5.13.0 預設）
# 放到 mpv 設定目錄的 script-opts/uosc.conf

# 時間軸：粗條（像 PotPlayer），暫停時常駐
timeline_style=bar
timeline_size=36
timeline_persistency=paused

# 控制列（時間軸上方一排按鈕）：
#   左＝播放／暫停、退 5 秒、進 5 秒；中＝倍速；右＝字幕、音軌、翻譯開關、選單、全螢幕
# 音量在最右側直條（volume=right）
controls=play-pause,command:replay_5:script-binding floattranslate/ft-seek-back?退 5 秒,command:forward_5:script-binding floattranslate/ft-seek-fwd?進 5 秒,gap,space,<video,audio>speed,space,<video,audio>subtitles?字幕,<has_audio>audio?音軌,command:translate:script-binding floattranslate/floattranslate-toggle?翻譯 開／關（Ctrl+t）,menu?選單（右鍵也可以）,gap,fullscreen
controls_size=34
controls_persistency=paused

# 滑鼠停 2 秒（mpv.conf 的 cursor-autohide）後整排控制列一起淡出
autohide=yes

# 介面文字：台灣繁中（uosc 內建的 zh-HK 改用台灣用詞，見 ui/uosc-zh-TW.json）
languages=~~/script-opts/uosc-zh-TW.json,en
