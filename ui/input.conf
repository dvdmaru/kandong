# 看懂 KanDong：右鍵選單＋快速鍵
#
# 選單由 uosc 從每行行尾的「井號＋驚嘆號」註解自動長出來：「>」是下一層，「---」是分隔線。
# （說明文字裡不能出現那兩個符號連在一起，否則這行說明也會被當成選單項目。）
# 行首是 # 的＝只出現在選單、沒有綁鍵。
# 綁鍵的那幾行，指令跟 floattranslate.lua 原本的一樣（同鍵同指令），所以舊快速鍵照舊。

MBTN_RIGHT  script-binding uosc/menu
MENU        script-binding uosc/menu

o           script-binding uosc/open-file                              #! 開啟檔案…
#           ignore                                                     #! ---

# ── 播放 ──
SPACE       cycle pause                                                #! 播放 > 播放／暫停
RIGHT       script-binding floattranslate/ft-seek-fwd                  #! 播放 > 進 5 秒
LEFT        script-binding floattranslate/ft-seek-back                 #! 播放 > 退 5 秒
Shift+RIGHT seek 30 relative exact                                     #! 播放 > 進 30 秒
Shift+LEFT  seek -30 relative exact                                    #! 播放 > 退 30 秒
#           ignore                                                     #! 播放 > ---
f           cycle fullscreen                                           #! 播放 > 全螢幕

# ── 字幕 ──
#           script-binding uosc/subtitles                              #! 字幕 > 選擇字幕軌…
#           script-binding uosc/load-subtitles                         #! 字幕 > 載入其他字幕檔…
#           ignore                                                     #! 字幕 > ---
ctrl+t      script-binding floattranslate/floattranslate-toggle        #! 字幕 > 雙語／只看原文（翻譯開關）
v           no-osd cycle sub-visibility; show-text "原文字幕：${?sub-visibility==yes:顯示}${?sub-visibility==no:隱藏（只看譯文）}" 1500 #! 字幕 > 原文字幕 顯示／隱藏（隱藏＝只看譯文）
#           ignore                                                     #! 字幕 > ---
=           script-binding floattranslate/ft-sub-bigger                #! 字幕 > 字放大
-           script-binding floattranslate/ft-sub-smaller               #! 字幕 > 字縮小
x           no-osd add sub-delay 0.1; show-text "字幕延遲 ${sub-delay}" 1500   #! 字幕 > 延後 0.1 秒
z           no-osd add sub-delay -0.1; show-text "字幕延遲 ${sub-delay}" 1500  #! 字幕 > 提早 0.1 秒

# ── 音訊 ──
#           script-binding uosc/audio                                  #! 音訊 > 選擇音軌…
#           script-binding uosc/audio-device                           #! 音訊 > 輸出裝置…
#           ignore                                                     #! 音訊 > ---
UP          script-binding floattranslate/ft-vol-up                    #! 音訊 > 音量 +5
DOWN        script-binding floattranslate/ft-vol-down                  #! 音訊 > 音量 -5
m           no-osd cycle mute; show-text "${?mute==yes:靜音}${?mute==no:取消靜音}" 1500 #! 音訊 > 靜音
#           show-text "聲音效果（人聲加強／低音／夜間模式）會在之後的版本加入" 2500 #! 音訊 > 聲音效果（即將推出）

# ── 翻譯 ──
#           script-binding floattranslate/floattranslate-toggle        #! 翻譯 > 翻譯 開／關
#           show-text "第一版只做台灣繁中" 2000                          #! 翻譯 > 目標語言：台灣繁中

# ── 模型（預告：播放中換模型會在之後的版本加入）──
#           show-text "播放中換模型會在之後的版本加入；現在請在翻譯伺服器那邊換模型（見使用說明）" 4000 #! 模型 > 翻譯：Hy-MT2 7B（準，預設）
#           show-text "播放中換模型會在之後的版本加入；現在請在翻譯伺服器那邊換模型（見使用說明）" 4000 #! 模型 > 翻譯：Hy-MT2 1.8B（快）
#           ignore                                                     #! 模型 > ---
#           show-text "播放中換聽寫模型會在之後的版本加入" 3000              #! 模型 > 聽寫：Whisper large-v3-turbo（預設）
#           show-text "播放中換聽寫模型會在之後的版本加入" 3000              #! 模型 > 聽寫：base.en（只聽英文、較快）

# ── 倍速（1–5、A／D／S 沿用原本的快速鍵）──
1           script-binding floattranslate/ft-speed-preset-1            #! 倍速 > 0.5x
#           set speed 0.75; show-text "播放速度 0.75x" 1500             #! 倍速 > 0.75x
2           script-binding floattranslate/ft-speed-preset-2            #! 倍速 > 1x
#           set speed 1.25; show-text "播放速度 1.25x" 1500             #! 倍速 > 1.25x
3           script-binding floattranslate/ft-speed-preset-3            #! 倍速 > 1.5x
4           script-binding floattranslate/ft-speed-preset-4            #! 倍速 > 2x
5           script-binding floattranslate/ft-speed-preset-5            #! 倍速 > 3x
#           ignore                                                     #! 倍速 > ---
d           script-binding floattranslate/ft-speed-up                  #! 倍速 > 加速 10%
a           script-binding floattranslate/ft-speed-down                #! 倍速 > 減速 10%
s           script-binding floattranslate/ft-speed-reset               #! 倍速 > 回到 1x

# ── 設定 ──
#           script-binding uosc/keybinds                               #! 設定 > 快速鍵一覽
#           script-binding uosc/open-config-directory                  #! 設定 > 開啟設定資料夾
#           ignore                                                     #! ---
q           quit                                                       #! 結束
