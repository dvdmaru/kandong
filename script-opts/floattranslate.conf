# 看懂 KanDong 設定（mpv script-opts）
# 檔名沿用內部代號 floattranslate.conf，放在 mpv 設定目錄的 script-opts/ 底下。
#   Windows 下載版：KanDong\portable_config\script-opts\
#   Mac 下載版：~/.config/kandong/mpv/script-opts/

# ===== 翻譯伺服器（OpenAI 相容的 /v1/chat/completions）=====
# 伺服器跟播放器在同一台電腦：維持預設即可。
# 伺服器在區網另一台電腦：改成 http://<那台電腦的區網 IP>:8080/v1/chat/completions
endpoint=http://127.0.0.1:8080/v1/chat/completions

# 伺服器開了 API key（區網模式一定會開）才需要填；內容＝伺服器那台的 key 檔內容
api_key=

# 模型名稱（llama-server 不檢查這個值，照填即可）
model=tencent/Hy-MT2-7B-GGUF

# 目標語言（送給模型的英文描述；含 "Traditional Chinese"＋"Taiwan" 會啟用台灣繁中專屬範例）
target_language=Traditional Chinese as used in Taiwan

# 譯文快取檔名的語言碼：<影片>.ft.zh-TW.json / .srt
lang_code=zh-TW

# 開檔自動開始翻譯（no 的話用 Ctrl+t 手動開）
auto_start=yes

# 翻譯時一起送給模型參考的前文句數（Hy-MT2 ctx 4096，12 句為實測安全值）
context_lines=12

# 單句輸出上限
max_tokens=256

# 譯文字級與底部邊距（以 1080p 為基準自動縮放）
font_size=46
bottom_margin=110

# 開翻譯時原文字幕往上移的位置（0–150；100＝貼底），讓出下方給譯文
raise_original_sub_pos=80

# 譯文快取（yes：寫 <影片>.ft.<lang>.json，全片譯完再輸出 .srt；重看不必再翻）
save_sidecar=yes

# 抽內嵌字幕軌、切語音辨識音訊用的 ffmpeg（不在 PATH 時填完整路徑）
ffmpeg_path=ffmpeg

# ===== 語音辨識（沒有字幕的影片；whisper.cpp 伺服器）=====
# 找不到文字字幕軌（或只有圖形字幕）時自動啟用
asr_enabled=yes
asr_endpoint=http://127.0.0.1:8090/inference
# 每段轉寫的音訊秒數；段尾多送 overlap 秒避免切斷句子
asr_chunk=120
asr_overlap=2
# 語言：auto＝自動偵測；確定是英文片填 en（更快更準）
asr_language=auto
# 單段轉寫逾時（秒）
asr_timeout=300
